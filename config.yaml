video: data/clip.mp4
sample_fps: 5
pose_model: yolov8m-pose.pt
bed_polygon:
- - 734
  - 573
- - 1196
  - 474
- - 1918
  - 740
- - 1454
  - 1072
thresholds:
  lying_angle_deg: 60
  standing_hip_ratio: 0.55
  walk_speed: 0.25
  min_kp_conf: 0.3
  unknown_score: 0.3
state_scoring:
  upright_angle_deg: 45
  low_hip_knee_ratio: 0.16
  high_hip_knee_ratio: 0.24
  high_bed_fraction: 0.5
  floor_bed_fraction_max: 0.25
  floor_torso_angle_min_deg: 60
  low_speed: 0.25
  visibility_unknown: 0.45
in_bed_states:
  - LYING_IN_BED
  - SITTING_ON_BED
events:
  exit_away_sec: 4
  exit_away_dist: 0.8
  return_approach_dist: 0.8
  unknown_hold_sec: 4
  return_sit_sec: 2
  return_lie_sec: 5
  out_of_view_exit_sec: 10
alerts:
  # Assumptions for demonstration only; these are not clinically validated.
  # A few minutes of edge sitting can be normal (e.g. putting on slippers);
  # a very long duration may indicate dizziness, confusion, or difficulty standing.
  edge_sit_monitor_sec: 300
  # Continuous UNKNOWN for this long is uncertain, so log/show MONITOR without paging.
  unknown_monitor_sec: 30
  # Low-confidence exits are uncertain and should be MONITOR, not caregiver ALERT.
  exit_low_conf: 0.6
  # A toilet visit may take 5-15 minutes; much longer can raise fall risk.
  # Night limits are stricter because the person may be unsteady and less observed.
  out_of_bed_alert_sec:
    day: 1800
    night: 900
  # Out of view is stricter than out of bed because the system cannot observe the person.
  out_of_view_alert_sec:
    day: 900
    night: 600
  # Floor lying is potentially dangerous; 10 seconds filters brief bending/pickups.
  floor_lying_alert_sec: 10
  # Local-clock interval used to select day/night thresholds.
  night_window: ["22:00", "06:00"]
  # The source video has no clock metadata; use this assumed local start time.
  video_start_clock: "02:00"
agent:
  trigger_conf: 0.6
  trigger_short_sec: 3
  bed_floor_conflict: [0.3, 0.7]
  max_steps_per_case: 6
  max_vlm_calls_per_case: 2
  max_vlm_calls_total: 40
  vlm_frames: 6
smoothing:
  self_probability: 0.98
  unknown_probability: 0.005
min_segment_sec: 2.0
